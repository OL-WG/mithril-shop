<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MithrilARM Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app-container">
        <div id="screen-main" class="screen active">
            <h2 class="title">MITHRILARM</h2>
            <div class="product-grid">
                <div class="product-item">
                    <img src="ruchka.webp" alt="Ручка">
                    <div class="p-info">
                        <b>Ручка Arm</b>
                        <p>$35.00</p>
                    </div>
                    <div class="btn-group">
                        <button class="btn-action btn-white" onclick="addToCart('Ручка Arm', 35)">ДОБАВИТЬ</button>
                        <button class="btn-action btn-dark" onclick="openInfo('Ручка Arm', 35, 'ruchka.webp')">ИНФО</button>
                    </div>
                </div>
                <div class="product-item">
                    <img src="expander.webp" alt="Эспандер">
                    <div class="p-info">
                        <b>Эспандер</b>
                        <p>$12.00</p>
                    </div>
                    <div class="btn-group">
                        <button class="btn-action btn-white" onclick="addToCart('Эспандер', 12)">ДОБАВИТЬ</button>
                        <button class="btn-action btn-dark" onclick="openInfo('Эспандер', 12, 'expander.webp')">ИНФО</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-cart" class="screen">
            <h3>Корзина</h3>
            <div id="cart-items"></div>
            
            <div class="promo-block">
                <label>Промокод</label>
                <div class="input-row">
                    <input type="text" id="promo-input" placeholder="Введите код...">
                    <button class="btn-action btn-white" onclick="applyPromo()">OK</button>
                </div>
            </div>
            
            <div class="total-bar">
                Итого: <span id="total-val">$0</span>
            </div>
        </div>

        <div id="screen-address" class="screen">
            <h3>Оформление заказа</h3>
            <div class="form-group">
                <label>Фамилия Имя Отчество</label>
                <input type="text" id="user-fio" placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" id="user-phone" placeholder="+7...">
            </div>
            <div class="form-group">
                <label>Страна</label>
                <input type="text" id="user-country">
            </div>
            <div class="form-group">
                <label>Город</label>
                <input type="text" id="user-city">
            </div>
            <div class="form-group">
                <label>Пункт СДЭК</label>
                <input type="text" id="user-cdek">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="user-email">
            </div>
        </div>
    </div>

    <div id="info-panel">
        <div class="info-content">
            <h2 id="info-title"></h2>
            <img id="info-img" src="" style="width:100%; height:180px; object-fit:contain;">
            <p>Профессиональное оборудование MithrilARM.</p>
            <button class="btn-action btn-white" onclick="closeInfo()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
