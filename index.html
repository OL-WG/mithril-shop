<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome-screen" class="screen active">
        <div class="welcome-container">
            <div class="welcome-btn" onclick="showScreen('shop-screen')">
                <span>🛒</span>
                <span>Войти в магазин</span>
            </div>
        </div>
    </div>

    <div id="shop-screen" class="screen">
        <h1 class="main-title">MITHRILARM</h1>
        <p class="subtitle">МАГАЗИН СПОРТИВНОГО ИНВЕНТАРЯ</p>
        
        <div class="products-grid">
            <div class="product-card" id="item1">
                <div class="badge-new">NEW</div>
                <div class="badge-stock">В НАЛИЧИИ</div>
                <img src="ruchka.webp" alt="Ручка Arm">
                <h3>РУЧКА ARM</h3>
                <p class="desc">Профессиональная ручка для тренировок армрестлеров.</p>
                <div class="card-footer">
                    <span class="price">$35.00</span>
                    <div class="button-group">
                        <button class="info-btn" onclick="showInfo('item1')">ИНФО</button>
                        <button class="add-trigger" onclick="addToCart('item1')">ДОБАВИТЬ</button>
                        <div class="quantity-control" style="display: none;">
                            <button onclick="changeQty('item1', -1)">-</button>
                            <span class="qty">0</span>
                            <button onclick="changeQty('item1', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="product-card" id="item2">
                <div class="badge-new">NEW</div>
                <div class="badge-stock">В НАЛИЧИИ</div>
                <img src="expander.webp" alt="Эспандер">
                <h3>ЭСПАНДЕР</h3>
                <p class="desc">Кистевой эспандер для развития взрывной силы хвата.</p>
                <div class="card-footer">
                    <span class="price">$12.00</span>
                    <div class="button-group">
                        <button class="info-btn" onclick="showInfo('item2')">ИНФО</button>
                        <button class="add-trigger" onclick="addToCart('item2')">ДОБАВИТЬ</button>
                        <div class="quantity-control" style="display: none;">
                            <button onclick="changeQty('item2', -1)">-</button>
                            <span class="qty">0</span>
                            <button onclick="changeQty('item2', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-screen" class="screen">
        <h2 class="screen-title">Корзина</h2>
        <div id="cart-items-list"></div>
        <div class="promo-section">
            <input type="text" id="promo-input" placeholder="Промокод">
            <button onclick="applyPromo()">OK</button>
        </div>
        <div id="cart-summary"></div>
    </div>

    <div id="delivery-screen" class="screen">
        <h2 class="screen-title">Доставка</h2>
        <div class="form-group">
            <input type="text" id="fio" placeholder="ФИО">
            <input type="tel" id="phone" placeholder="Номер телефона">
            <input type="text" id="country" placeholder="Страна">
            <input type="text" id="city" placeholder="Город">
            <input type="text" id="address" placeholder="Адрес СДЭК">
            <input type="email" id="email" placeholder="Email">
        </div>
    </div>

    <div id="checkout-screen" class="screen">
        <h2 class="screen-title">Проверка</h2>
        <div id="check-order" class="check-section"></div>
        <div id="check-delivery" class="check-section"></div>
        <div id="final-pay-amount"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
