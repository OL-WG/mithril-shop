<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MithrilARM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        #main-container { min-height: 100vh; padding-bottom: 20px; }
        .screen { display: none; padding: 15px; }
        #main-screen { display: block; }

        /* Сетка товаров */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .product-item { background: #1c1c1c; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .product-item img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; }
        
        /* Кнопки — теперь одинаково белые */
        .btn-group { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .action-btn { background: #fff; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        
        /* Поля ввода и Форма */
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #888; margin: 0 0 5px 5px; }
        .form-group input { width: 100%; padding: 12px; background: #1c1c1c; border: 1px solid #333; border-radius: 8px; color: #fff; box-sizing: border-box; }

        /* Корзина и Скидки */
        .cart-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .promo-row { display: flex; gap: 8px; margin-top: 10px; }
        .promo-btn { background: #fff; color: #000; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="main-screen" class="screen">
            <h2 style="text-align: center;">MITHRILARM</h2>
            <div class="product-grid">
                <div class="product-item">
                    <img src="ruchka.webp">
                    <b>Ручка Arm</b>
                    <div style="color:#888; margin: 5px 0 10px;">$35.00</div>
                    <div class="btn-group">
                        <button class="action-btn" onclick="addToCart('Ручка Arm', 35)">ДОБАВИТЬ</button>
                        <button class="action-btn" onclick="showInfo('Ручка Arm')">ИНФО</button>
                    </div>
                </div>
                <div class="product-item">
                    <img src="expander.webp">
                    <b>Эспандер</b>
                    <div style="color:#888; margin: 5px 0 10px;">$12.00</div>
                    <div class="btn-group">
                        <button class="action-btn" onclick="addToCart('Эспандер', 12)">ДОБАВИТЬ</button>
                        <button class="action-btn" onclick="showInfo('Эспандер')">ИНФО</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="cart-screen" class="screen">
            <h3>Ваша корзина</h3>
            <div id="cart-list"></div>
            <div class="form-group" style="margin-top: 20px;">
                <label>Промокод</label>
                <div class="promo-row">
                    <input type="text" id="promo-input" placeholder="Введите код">
                    <button class="promo-btn" onclick="applyPromo()">OK</button>
                </div>
                <div id="promo-status" style="font-size: 12px; margin-top: 5px;"></div>
            </div>
            <h3 id="total-display">Итого: $0.00</h3>
        </div>

        <div id="address-screen" class="screen">
            <h3>Данные получателя</h3>
            <div class="form-group">
                <label>Фамилия Имя Отчество</label>
                <input type="text" id="fio" placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" id="phone" placeholder="+7 (___) ___-__-__">
            </div>
            <div class="form-group">
                <label>Страна</label>
                <input type="text" id="country" placeholder="Россия">
            </div>
            <div class="form-group">
                <label>Город</label>
                <input type="text" id="city" placeholder="Москва">
            </div>
            <div class="form-group">
                <label>Адрес пункта СДЭК</label>
                <input type="text" id="cdek" placeholder="ул. Ленина, д. 10">
            </div>
            <div class="form-group">
                <label>Электронная почта (любая)</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
