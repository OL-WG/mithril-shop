<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Принудительные стили для черно-белых кнопок внутри страницы */
        .add-btn { 
            background: #000 !important; 
            color: #fff !important; 
            border: 1px solid #333 !important;
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 12px; 
        }
        
        .promo-btn { 
            background: #000 !important; 
            color: #fff !important; 
            border: 1px solid #333 !important;
            padding: 0 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 12px; 
        }

        /* Стиль для блока информации о доставке на финальном экране */
        #check-address {
            text-align: left;
            padding: 10px;
            background: #1c1c1c;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="main-screen">
        <h2 class="shop-title">MorozovShop</h2>
        <div class="items-grid">
            <div class="item-card">
                <img src="ruchka.webp" alt="Ручка Arm">
                <h3>Ручка Arm</h3>
                <p class="price">$35.00</p>
                <div class="controls" id="controls-ruchka">
                    <button class="add-btn" onclick="addToCart('ruchka', 'Ручка', 35)">ДОБАВИТЬ</button>
                </div>
                <button class="info-btn">ИНФО</button>
            </div>

            <div class="item-card">
                <img src="expander.webp" alt="Эспандер">
                <h3>Эспандер</h3>
                <p class="price">$12.00</p>
                <div class="controls" id="controls-expander">
                    <button class="add-btn" onclick="addToCart('expander', 'Эспандер', 12)">ДОБАВИТЬ</button>
                </div>
                <button class="info-btn">ИНФО</button>
            </div>
        </div>
    </div>

    <div id="cart-screen" style="display: none;">
        <h2 class="screen-title">Корзина</h2>
        <div id="cart-items"></div>
        <div class="promo-section">
            <input type="text" id="promo-input" placeholder="Промокод">
            <button class="promo-btn" onclick="applyPromo()">OK</button>
        </div>
        <div class="totals">
            <p>Сумма: <span id="subtotal-price">$0</span></p>
            <p>Итог: <span id="total-price">$0</span></p>
        </div>
    </div>

    <div id="address-screen" style="display: none;">
        <h2 class="screen-title">Доставка</h2>
        <div class="input-group">
            <input type="text" id="fio" placeholder="ФИО">
            <input type="text" id="phone" placeholder="Телефон">
            <input type="text" id="country" placeholder="Страна">
            <input type="text" id="city" placeholder="Город">
            <input type="text" id="cdek-addr" placeholder="Адрес СДЭК">
            <input type="email" id="email" placeholder="Email">
        </div>
    </div>

    <div id="checkout-screen" style="display: none;">
        <h2 class="screen-title">Проверка</h2>
        <div class="check-section">
            <h4>Заказ:</h4>
            <div id="check-items"></div>
        </div>
        <div class="check-section">
            <h4>Доставка:</h4>
            <div id="check-address"></div>
        </div>
        <div class="final-total">Итого: <span id="final-price">$0</span></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
