<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="shop-screen" class="screen active">
        <h2 class="main-title">MITHRILARM</h2>
        <div class="container">
            <div class="card" id="item1">
                <img src="ruchka.webp">
                <h3>Ручка Arm</h3>
                <div class="price">$35.00</div>
                <button class="btn-white add-trigger" onclick="addToCart('item1')">ДОБАВИТЬ</button>
                <div class="counter">
                    <button onclick="changeQty('item1', -1)">-</button>
                    <span class="qty">1</span>
                    <button onclick="changeQty('item1', 1)">+</button>
                </div>
                <button class="btn-description" onclick="showInfo('item1')">ОПИСАНИЕ</button>
            </div>

            <div class="card" id="item2">
                <img src="expander.webp">
                <h3>Эспандер</h3>
                <div class="price">$12.00</div>
                <button class="btn-white add-trigger" onclick="addToCart('item2')">ДОБАВИТЬ</button>
                <div class="counter">
                    <button onclick="changeQty('item2', -1)">-</button>
                    <span class="qty">1</span>
                    <button onclick="changeQty('item2', 1)">+</button>
                </div>
                <button class="btn-description" onclick="showInfo('item2')">ОПИСАНИЕ</button>
            </div>
        </div>
    </div>

    <div id="cart-screen" class="screen">
        <div class="header-nav"><span onclick="showShop()">✕ Назад</span></div>
        <h2 class="title-left">Корзина</h2>
        <div id="cart-items-list" class="cart-list"></div>
        <div class="promo-container">
            <input type="text" id="promo-input" placeholder="Промокод">
            <button class="btn-ok-black" onclick="applyPromo()">ОК</button>
        </div>
        <div class="summary" id="cart-summary"></div>
    </div>

    <div id="delivery-screen" class="screen">
        <div class="header-nav"><span onclick="showCart()">✕ Назад</span></div>
        <h2 class="title-left">Доставка</h2>
        <div class="form-container">
            <input type="text" id="fio" placeholder="ФИО">
            <input type="text" id="phone" placeholder="Телефон">
            <input type="text" id="city" placeholder="Город">
            <input type="text" id="address" placeholder="Адрес СДЭК">
        </div>
    </div>

    <div id="checkout-screen" class="screen">
        <div class="header-nav"><span onclick="showDelivery()">✕ Назад</span></div>
        <h2 class="title-left">Проверка</h2>
        <div class="data-group">
            <div class="group-label">ЗАКАЗ</div>
            <div id="check-order" class="group-content"></div>
        </div>
        <div class="data-group">
            <div class="group-label">ДОСТАВКА</div>
            <div id="check-delivery" class="group-content"></div>
        </div>
        <div class="final-pay-row">
            <span>К оплате:</span>
            <span id="final-pay-amount"></span>
        </div>
    </div>

    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <div id="modal-body"></div>
            <button class="btn-white-modal" onclick="closeModal()">ПОНЯТНО</button>
        </div>
    </div>

    <div class="footer-fixed">
        <button id="footer-btn" class="btn-main">В КОРЗИНУ</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
