<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        #main-container { padding-bottom: 80px; text-align: center; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .product-item { background: #151515; border-radius: 15px; padding: 15px; border: 1px solid #222; }
        .product-item img { width: 100%; height: 100px; object-fit: contain; }
        .price { color: #888; font-weight: bold; margin: 10px 0; }
        
        /* Кнопки */
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .add-btn { background: #fff; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .info-btn { background: #222; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 11px; }
        
        .count-ctrl { display: none; align-items: center; justify-content: space-between; }
        .cnt-btn { background: #333; color: #fff; border: none; width: 35px; height: 35px; border-radius: 8px; font-size: 18px; }

        /* Формы и Корзина */
        .screen { display: none; padding: 15px; text-align: left; }
        .active { display: block; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; box-sizing: border-box; }
        .promo-section { border: 1px solid #fff; padding: 15px; border-radius: 12px; margin: 15px 0; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="main-screen" class="screen active">
            <h2>MorozovShop</h2>
            <div class="product-grid">
                <div class="product-item">
                    <img src="ruchka.webp">
                    <b>Ручка Arm</b>
                    <div class="price">$35.00</div>
                    <div class="btn-group">
                        <button id="add-Handle" class="add-btn" onclick="addToCart('Handle', 35)">ДОБАВИТЬ</button>
                        <div id="ctrl-Handle" class="count-ctrl">
                            <button class="cnt-btn" onclick="changeCount('Handle', -1)">-</button>
                            <span id="count-Handle">1</span>
                            <button class="cnt-btn" onclick="changeCount('Handle', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="product-item">
                    <img src="expander.webp">
                    <b>Эспандер</b>
                    <div class="price">$12.00</div>
                    <div class="btn-group">
                        <button id="add-Expander" class="add-btn" onclick="addToCart('Expander', 12)">ДОБАВИТЬ</button>
                        <div id="ctrl-Expander" class="count-ctrl">
                            <button class="cnt-btn" onclick="changeCount('Expander', -1)">-</button>
                            <span id="count-Expander">1</span>
                            <button class="cnt-btn" onclick="changeCount('Expander', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="cart-screen" class="screen">
            <h3>Корзина</h3>
            <div id="cart-list"></div>
            <div class="promo-section">
                <label>Промокод</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="promo-input" placeholder="Код (JARVIS)">
                    <button onclick="applyPromo()" class="add-btn" style="height:42px; margin-top:8px;">OK</button>
                </div>
                <div id="promo-msg" style="font-size:12px;"></div>
            </div>
            <div id="total-price" style="font-size:20px; font-weight:bold; text-align:right;"></div>
        </div>

        <div id="address-screen" class="screen">
            <h3>Доставка</h3>
            <input type="text" id="fio" placeholder="ФИО">
            <input type="tel" id="phone" placeholder="Телефон">
            <input type="text" id="city" placeholder="Город">
            <input type="text" id="cdek" placeholder="Адрес СДЭК">
            <input type="email" id="email" placeholder="Email">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
