<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Глобальные настройки темы */
        body { background-color: #000; color: #fff; margin: 0; padding: 0; font-family: sans-serif; }
        
        /* Дизайн карточек товаров */
        .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .item-card { background: #1c1c1c; border-radius: 15px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .item-card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .item-card h3 { font-size: 14px; margin: 5px 0; }
        .price { color: #888; font-size: 14px; margin-bottom: 10px; }

        /* ВСЕ КНОПКИ: ЧЕРНЫЙ ФОН, БЕЛЫЙ ТЕКСТ */
        .add-btn, .promo-btn, .info-btn { 
            background: #000 !important; 
            color: #fff !important; 
            border: 1px solid #333 !important; /* Тонкая рамка, чтобы кнопка не сливалась с фоном */
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 11px;
            margin-top: 5px;
        }
        
        /* Поля ввода */
        input { background: #1c1c1c; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }

        /* Блок информации о доставке на финальном экране */
        #check-address { text-align: left; padding: 15px; background: #1c1c1c; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .check-section h4 { margin-top: 0; color: #888; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>
    <div id="main-screen">
        <h2 style="text-align:center;">MorozovShop</h2>
        <div class="items-grid">
            <div class="item-card">
                <img src="ruchka.webp" alt="Ручка Arm">
                <h3>Ручка Arm</h3>
                <p class="price">$35.00</p>
                <div id="controls-ruchka" style="width:100%">
                    <button class="add-btn" onclick="addToCart('ruchka', 'Ручка Arm', 35)">ДОБАВИТЬ</button>
                </div>
                <button class="info-btn">ИНФО</button>
            </div>

            <div class="item-card">
                <img src="expander.webp" alt="Эспандер">
                <h3>Эспандер</h3>
                <p class="price">$12.00</p>
                <div id="controls-expander" style="width:100%">
                    <button class="add-btn" onclick="addToCart('expander', 'Эспандер', 12)">ДОБАВИТЬ</button>
                </div>
                <button class="info-btn">ИНФО</button>
            </div>
        </div>
    </div>

    <div id="cart-screen" style="display: none; padding: 20px;">
        <h2>Корзина</h2>
        <div id="cart-items"></div>
        <div style="display:flex; gap:10px; margin: 20px 0;">
            <input type="text" id="promo-input" placeholder="Промокод" style="margin:0;">
            <button class="promo-btn" style="width: auto;" onclick="applyPromo()">OK</button>
        </div>
        <div style="border-top: 1px solid #333; padding-top: 10px;">
            <p>Сумма: <span id="subtotal-price" style="float:right;">$0</span></p>
            <p>Итог: <span id="total-price" style="float:right; font-weight:bold;">$0</span></p>
        </div>
    </div>

    <div id="address-screen" style="display: none; padding: 20px;">
        <h2>Доставка</h2>
        <input type="text" id="fio" placeholder="ФИО">
        <input type="text" id="phone" placeholder="Телефон">
        <input type="text" id="country" placeholder="Страна">
        <input type="text" id="city" placeholder="Город">
        <input type="text" id="cdek-addr" placeholder="Адрес СДЭК">
        <input type="email" id="email" placeholder="Email">
    </div>

    <div id="checkout-screen" style="display: none; padding: 20px;">
        <h2>Проверка</h2>
        <div class="check-section">
            <h4>Заказ:</h4>
            <div id="check-items" style="background:#1c1c1c; padding:15px; border-radius:12px; margin-bottom:20px;"></div>
        </div>
        <div class="check-section">
            <h4>Доставка:</h4>
            <div id="check-address"></div>
        </div>
        <h3 style="text-align:right; margin-top:20px;">Итого: <span id="final-price">$0</span></h3>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
