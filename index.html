<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div id="main-screen">
        <h2 style="text-align:center;">MorozovShop</h2>
        <div class="items-grid">
            <div class="item-card">
                <img src="ruchka.webp" alt="Ручка Arm">
                <h3>Ручка Arm</h3>
                <p class="price">$35.00</p>
                <div id="controls-ruchka">
                    <button class="black-btn" onclick="addToCart('ruchka', 'Ручка Arm', 35)">ДОБАВИТЬ</button>
                </div>
                <button class="black-btn info" onclick="showInfo('ruchka')">ИНФО</button>
            </div>

            <div class="item-card">
                <img src="expander.webp" alt="Эспандер">
                <h3>Эспандер</h3>
                <p class="price">$12.00</p>
                <div id="controls-expander">
                    <button class="black-btn" onclick="addToCart('expander', 'Эспандер', 12)">ДОБАВИТЬ</button>
                </div>
                <button class="black-btn info" onclick="showInfo('expander')">ИНФО</button>
            </div>
        </div>
    </div>

    <div id="cart-screen" style="display: none; padding: 20px;">
        <h2>Корзина</h2>
        <div id="cart-items"></div>
        <div class="promo-container">
            <input type="text" id="promo-input" placeholder="Промокод">
            <button class="black-btn" style="width: 60px; margin: 0;" onclick="applyPromo()">OK</button>
        </div>
        <div class="totals">
            <p>Сумма: <span id="subtotal-price">$0</span></p>
            <p id="discount-row" style="display:none; color: #ff4444;">Скидка: <span id="discount-val">0%</span></p>
            <p>Итог: <span id="total-price">$0</span></p>
        </div>
    </div>

    <div id="address-screen" style="display: none; padding: 20px;">
        <h2>Доставка</h2>
        <input type="text" id="fio" placeholder="ФИО">
        <input type="text" id="phone" placeholder="Телефон">
        <input type="text" id="country" placeholder="Страна">
        <input type="text" id="city" placeholder="Город">
        <input type="text" id="cdek-addr" placeholder="Адрес СДЭК">
        <input type="email" id="email" placeholder="Email">
    </div>

    <div id="checkout-screen" style="display: none; padding: 20px;">
        <h2>Проверка</h2>
        <div class="dark-block" id="check-items"></div>
        <div class="dark-block" id="check-address"></div>
        <h3 style="text-align:right;">Итого со скидкой: <span id="final-price">$0</span></h3>
    </div>

    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeInfo()">&times;</span>
            <div id="info-text"></div>
        </div>
    </div>

    <script src="js/script.js?v=10"></script>
</body>
</html>
