<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>MorozovShop</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>


<div id="shop-screen" class="screen active">

<h2 class="main-title">MITHRILARM</h2>

<div class="container">


<div class="card" id="item1">

<img src="ruchka.webp">

<h3>Ручка Arm</h3>

<div class="price">$35.00</div>

<button class="btn-black add-trigger" onclick="addToCart('item1')">ДОБАВИТЬ</button>

<div class="counter">

<button onclick="changeQty('item1',-1)">-</button>

<span class="qty">1</span>

<button onclick="changeQty('item1',1)">+</button>

</div>

<button class="btn-info" onclick="showInfo('item1')">ИНФО</button>

</div>



<div class="card" id="item2">

<img src="expander.webp">

<h3>Эспандер</h3>

<div class="price">$12.00</div>

<button class="btn-black add-trigger" onclick="addToCart('item2')">ДОБАВИТЬ</button>

<div class="counter">

<button onclick="changeQty('item2',-1)">-</button>

<span class="qty">1</span>

<button onclick="changeQty('item2',1)">+</button>

</div>

<button class="btn-info" onclick="showInfo('item2')">ИНФО</button>

</div>


</div>

</div>



<div id="cart-screen" class="screen">

<div class="header-nav" onclick="showShop()">✕ Назад</div>

<h2 class="title-left">Корзина</h2>

<div id="cart-items-list" class="cart-list"></div>


<div class="promo-container">

<input type="text" id="promo-input" placeholder="Промокод">

<button class="btn-ok-bw" onclick="applyPromo()">OK</button>

</div>


<div id="cart-summary" class="summary"></div>

</div>



<div id="delivery-screen" class="screen">

<div class="header-nav" onclick="showCart()">✕ Назад</div>

<h2 class="title-left">Доставка</h2>

<div class="form-container">

<input type="text" id="fio" placeholder="ФИО">

<input type="text" id="phone" placeholder="Номер телефона">

<input type="text" id="country" placeholder="Страна">

<input type="text" id="city" placeholder="Город">

<input type="text" id="address" placeholder="Адрес СДЭК">

<input type="email" id="email" placeholder="Email">

</div>

</div>



<div id="checkout-screen" class="screen">

<div class="header-nav" onclick="showDelivery()">✕ Назад</div>

<h2 class="title-left">Проверка заказа</h2>

<div id="check-order"></div>

<div id="check-delivery"></div>

<h3 id="final-pay-amount"></h3>

</div>



<div id="info-modal" class="modal">

<div class="modal-content">

<span class="close-modal" onclick="closeModal()">✕</span>

<div id="modal-body"></div>

</div>

</div>


<script src="script.js"></script>

</body>

</html>
