<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Твой стиль */
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 0; text-align: center; }
        h2 { margin-top: 20px; letter-spacing: 2px; text-transform: uppercase; font-weight: 900; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .product-item { background: #151515; border-radius: 18px; padding: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid #222; }
        .product-item img { width: 100%; height: 110px; object-fit: contain; margin-bottom: 10px; }
        .product-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .price { color: #888; font-size: 16px; margin-bottom: 12px; }
        .add-btn { background: #fff; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .count-ctrl { display: none; align-items: center; justify-content: space-between; width: 100%; }
        .cnt-btn { background: #333; color: #fff; border: none; width: 35px; height: 35px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="main-container">
        <h2>MorozovShop</h2>
        <div class="product-grid" id="product-grid">
            </div>
    </div>

    <script>
        // Твоя логика (теперь прямо в HTML, чтобы не искать папки)
        let tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = 'https://jzlrxsfbfhgfmrwrtwv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DXHDERQmtCOylso58j4AWg_sM4ymrD0';

        async function loadProducts() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
                    headers: { 
                        'apikey': SUPABASE_KEY, 
                        'Authorization': `Bearer ${SUPABASE_KEY}` 
                    }
                });
                const products = await response.json();
                
                const grid = document.getElementById('product-grid');
                grid.innerHTML = ''; 

                if (!products || products.length === 0) {
                    grid.innerHTML = '<p>Товары не найдены. Проверь базу!</p>';
                    return;
                }

                products.forEach(p => {
                    grid.innerHTML += `
                        <div class="product-item">
                            <img src="${p.image_url}">
                            <div class="product-name">${p.title}</div>
                            <div class="price">$${p.price}</div>
                            <button class="add-btn" onclick="addToCart(this)">ДОБАВИТЬ</button>
                        </div>`;
                });
            } catch (err) {
                document.getElementById('product-grid').innerHTML = '<p style="color:red">Ошибка связи с базой</p>';
            }
        }

        function addToCart(btn) {
            btn.innerText = "В КОРЗИНЕ";
            btn.style.background = "#333";
            btn.style.color = "#fff";
        }

        loadProducts();
    </script>
</body>
</html>
