<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="shop-screen" class="screen active">
        <h2>MITHRILARM</h2>
        <div class="container">
            <div class="card" id="item1">
                <img src="ruchka.webp" alt="Ручка Arm">
                <h3>Ручка Arm</h3>
                <div class="price">$35.00</div>
                <button class="btn-white add-trigger" onclick="addToCart('item1')">добавить</button>
                <div class="counter">
                    <button onclick="changeQty('item1', -1)">-</button>
                    <span class="qty">1</span>
                    <button onclick="changeQty('item1', 1)">+</button>
                </div>
                <button class="btn-gray">инфо</button>
            </div>

            <div class="card" id="item2">
                <img src="expander.webp" alt="Эспандер">
                <h3>Эспандер</h3>
                <div class="price">$12.00</div>
                <button class="btn-white add-trigger" onclick="addToCart('item2')">добавить</button>
                <div class="counter">
                    <button onclick="changeQty('item2', -1)">-</button>
                    <span class="qty">1</span>
                    <button onclick="changeQty('item2', 1)">+</button>
                </div>
                <button class="btn-gray">инфо</button>
            </div>
        </div>
    </div>

    <div id="cart-screen" class="screen">
        <div class="cart-header">
            <span onclick="showShop()" class="back-link">✕ Назад</span>
        </div>
        <h2 class="cart-title">Корзина</h2>
        <div id="cart-items-list" class="cart-list"></div>
        <div class="promo-block">
            <input type="text" class="promo-input" placeholder="Jarvis">
            <button class="btn-ok">OK</button>
        </div>
        <div class="cart-summary">
            <div id="total-sum">Сумма: $0</div>
            <div id="total-final">Итог: $0</div>
        </div>
    </div>

    <div class="footer-fixed">
        <button id="footer-btn" class="btn-white btn-main" onclick="handleFooterClick()"></button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
