<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MithrilARM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
        #main-container { min-height: 100vh; padding-bottom: 80px; }
        
        /* Сетка товаров */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .product-item { background: #1c1c1c; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .product-item img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; }
        
        /* Кнопки (белые как на 1 скрине) */
        .btn-group { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .action-btn { background: #fff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        .info-btn { background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; }

        /* Форма (как на 3 скрине) */
        .address-form { padding: 20px; text-align: left; display: none; }
        .address-form label { font-size: 12px; color: #888; display: block; margin: 10px 0 5px 5px; }
        .address-form input { width: 100%; padding: 12px; background: #1c1c1c; border: 1px solid #333; border-radius: 8px; color: #fff; box-sizing: border-box; }

        /* Корзина */
        #cart-screen { display: none; padding: 20px; text-align: left; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="main-screen">
            <h2 style="margin: 20px 0;">MITHRILARM</h2>
            <div class="product-grid">
                <div class="product-item">
                    <img src="ruchka.webp">
                    <b>Ручка Arm</b>
                    <div style="color:#888; margin: 5px 0 10px;">$35.00</div>
                    <div class="btn-group">
                        <button class="action-btn" onclick="addToCart('Ручка Arm', 35)">ДОБАВИТЬ</button>
                        <button class="info-btn" onclick="showInfo('Ручка Arm')">ИНФО</button>
                    </div>
                </div>
                <div class="product-item">
                    <img src="expander.webp">
                    <b>Эспандер</b>
                    <div style="color:#888; margin: 5px 0 10px;">$12.00</div>
                    <div class="btn-group">
                        <button class="action-btn" onclick="addToCart('Эспандер', 12)">ДОБАВИТЬ</button>
                        <button class="info-btn" onclick="showInfo('Эспандер')">ИНФО</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="cart-screen">
            <h3>Ваша корзина</h3>
            <div id="cart-list"></div>
            <div style="margin-top:20px; font-size:18px; font-weight:bold;">
                Итого: <span id="total-price">$0.00</span>
            </div>
        </div>

        <div id="address-screen" class="address-form">
            <h3>Данные получателя</h3>
            
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="fio" placeholder="Иванов Иван Иванович">
            
            <label>Номер телефона</label>
            <input type="tel" id="phone" placeholder="+7 (___) ___-__-__">

            <label>Страна</label>
            <input type="text" id="country" placeholder="Россия">
            
            <label>Город</label>
            <input type="text" id="city" placeholder="Москва">
            
            <label>Адрес пункта СДЭК</label>
            <input type="text" id="cdek" placeholder="ул. Ленина, д. 10">
            
            <label>Электронная почта (любая)</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
