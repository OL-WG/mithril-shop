<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MithrilArm</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="shop-screen" class="screen active">
        <h2 class="main-title">MITHRILARM</h2>
        
        <div class="products-grid">

            <!-- Товар 1 -->
            <div class="product-card" id="item1">
                <div class="product-image">
                    <img src="ruchka.webp" alt="Ручка Arm">
                </div>
                <div class="product-info">
                    <h3>Ручка Arm</h3>
                    <div class="price">$35.00</div>
                    <p class="description">Профессиональная ручка для тренировок</p>
                    
                    <button class="btn-add add-trigger" onclick="addToCart('item1')">ДОБАВИТЬ</button>
                    
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="changeQty('item1', -1)">−</button>
                        <span class="qty">1</span>
                        <button class="qty-btn" onclick="changeQty('item1', 1)">+</button>
                    </div>

                    <button class="btn-info" onclick="showInfo('item1')">ИНФО</button>
                </div>
            </div>

            <!-- Товар 2 -->
            <div class="product-card" id="item2">
                <div class="product-image">
                    <img src="expander.webp" alt="Эспандер">
                </div>
                <div class="product-info">
                    <h3>Эспандер</h3>
                    <div class="price">$12.00</div>
                    <p class="description">Кистевой эспандер для силы хвата</p>
                    
                    <button class="btn-add add-trigger" onclick="addToCart('item2')">ДОБАВИТЬ</button>
                    
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="changeQty('item2', -1)">−</button>
                        <span class="qty">1</span>
                        <button class="qty-btn" onclick="changeQty('item2', 1)">+</button>
                    </div>

                    <button class="btn-info" onclick="showInfo('item2')">ИНФО</button>
                </div>
            </div>

        </div>
    </div>

    <div id="cart-screen" class="screen">
        <div class="header-nav" onclick="showShop()">✕ Назад</div>
        <h2 class="title-left">Корзина</h2>
        <div id="cart-items-list" class="cart-list"></div>
        
        <div class="promo-wrapper">
            <div class="promo-container">
                <input type="text" id="promo-input" placeholder="Промокод">
                <button class="btn-ok-bw" onclick="applyPromo()">OK</button>
            </div>
        </div>

        <div id="cart-summary" class="summary"></div>
    </div>

    <div id="delivery-screen" class="screen">
        <div class="header-nav" onclick="showCart()">✕ Назад</div>
        <h2 class="title-left">Доставка</h2>
        <div class="form-container">
            <input type="text" id="fio" placeholder="ФИО">
            <input type="tel" id="phone" placeholder="Номер телефона">
            <input type="text" id="country" placeholder="Страна">
            <input type="text" id="city" placeholder="Город">
            <input type="text" id="address" placeholder="Адрес СДЭК">
            <input type="email" id="email" placeholder="Email">
        </div>
    </div>

    <div id="checkout-screen" class="screen">
        <div class="header-nav" onclick="showDelivery()">✕ Назад</div>
        <h2 class="title-left">Проверка заказа</h2>
        <div id="check-order" class="check-section"></div>
        <div id="check-delivery" class="check-section"></div>
        <div id="check-promo-info" class="promo-status"></div>
        <div id="final-pay-amount"></div>
    </div>

    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
