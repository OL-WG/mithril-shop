<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jarvis Store</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<div id="catalog-screen" class="screen active">

<h1 class="title-left">Каталог</h1>

<div class="products">


<div class="product">

<img src="https://via.placeholder.com/150">

<h3 class="product-name">Ручка Arm</h3>

<div class="price">$35</div>

<div class="qty">

<button onclick="changeQty('arm',-1)">-</button>

<span id="qty-arm">0</span>

<button onclick="changeQty('arm',1)">+</button>

</div>

</div>



<div class="product">

<img src="https://via.placeholder.com/150">

<h3 class="product-name">Эспандер</h3>

<div class="price">$12</div>

<div class="qty">

<button onclick="changeQty('expander',-1)">-</button>

<span id="qty-expander">0</span>

<button onclick="changeQty('expander',1)">+</button>

</div>

</div>


</div>


<button class="cart-btn" onclick="showCart()">
Корзина (<span id="cart-count">0</span>)
</button>

</div>




<div id="cart-screen" class="screen">

<div class="header-nav" onclick="showCatalog()">Назад</div>

<h2 class="title-left">Корзина</h2>

<div id="cart-items"></div>

<div class="promo-container">

<input id="promo-input" placeholder="Промокод">

<button class="btn-ok-bw" onclick="applyPromo()">OK</button>

</div>

<div class="total" id="cart-total"></div>

<button class="checkout-btn" onclick="showDelivery()">Оформить</button>

</div>




<div id="delivery-screen" class="screen">

<div class="header-nav" onclick="showCart()">Назад</div>

<h2 class="title-left">Доставка</h2>

<div class="form-container">

<input type="text" id="fio" placeholder="ФИО">

<input type="tel" id="phone" placeholder="Номер телефона" pattern="[0-9]*" inputmode="numeric">

<input type="text" id="country" placeholder="Страна">

<input type="text" id="city" placeholder="Город">

<input type="text" id="address" placeholder="Адрес СДЭК">

<input type="email" id="email" placeholder="Email">

</div>

<button class="checkout-btn" onclick="showCheckout()">Продолжить</button>

</div>




<div id="checkout-screen" class="screen">

<div class="header-nav" onclick="showDelivery()">Назад</div>

<h2 class="title-left">Проверка заказа</h2>

<div id="check-order"></div>

<div id="check-delivery"></div>

<div id="final-pay-amount"></div>

<button class="checkout-btn" onclick="sendOrder()">Оплатить</button>

</div>


<script src="script.js"></script>

</body>

</html>
