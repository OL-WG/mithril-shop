<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MithrilArm</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="shop-screen" class="screen active">
    <div class="header-area">
        <h2 class="main-title">MITHRILARM</h2>
        <p class="subtitle">МАГАЗИН СПОРТИВНОГО ИНВЕНТАРЯ</p>
    </div>

    <div class="products-list">

        <div class="product-card" id="item1">
            <div class="image-box">
                <div class="badge badge-new">+ NEW</div>
                <div class="badge badge-stock">В НАЛИЧИИ</div>
                <img src="ruchka.webp">
            </div>
            <div class="product-info">
                <h3>РУЧКА ARM</h3>
                <p class="description">Профессиональная ручка для тренировок армрестлеров.</p>

                <div class="price-row">
                    <div class="price-val">$35.00</div>
                    <div class="controls">
                        <button class="btn-info-small" onclick="showInfo('item1')">ИНФО</button>
                        <button class="btn-add-main add-trigger" onclick="addToCart('item1')">ДОБАВИТЬ</button>

                        <div class="quantity-control">
                            <button class="qty-btn" onclick="changeQty('item1', -1)">−</button>
                            <span class="qty">1</span>
                            <button class="qty-btn" onclick="changeQty('item1', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="product-card" id="item2">
            <div class="image-box">
                <div class="badge badge-new">+ NEW</div>
                <div class="badge badge-stock">В НАЛИЧИИ</div>
                <img src="expander.webp">
            </div>
            <div class="product-info">
                <h3>ЭСПАНДЕР</h3>
                <p class="description">Кистевой эспандер для развития хвата.</p>

                <div class="price-row">
                    <div class="price-val">$12.00</div>
                    <div class="controls">
                        <button class="btn-info-small" onclick="showInfo('item2')">ИНФО</button>
                        <button class="btn-add-main add-trigger" onclick="addToCart('item2')">ДОБАВИТЬ</button>

                        <div class="quantity-control">
                            <button class="qty-btn" onclick="changeQty('item2', -1)">−</button>
                            <span class="qty">1</span>
                            <button class="qty-btn" onclick="changeQty('item2', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- МОДАЛКА -->
<div id="info-modal" class="modal">
    <div class="modal-content">
        <div id="modal-body"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
