<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MorozovShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Весь твой CSS уже здесь, чтобы не было проблем с путями */
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 0; text-align: center; }
        #main-container { height: 100vh; overflow-y: auto; padding-bottom: 100px; box-sizing: border-box; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .product-item { background: #151515; border-radius: 18px; padding: 15px; border: 1px solid #222; }
        .product-item img { width: 100%; height: 110px; object-fit: contain; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .add-btn { background: #fff; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .info-btn { background: #222; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 10px; font-size: 10px; cursor: pointer; }
        .count-ctrl { display: none; align-items: center; justify-content: space-between; }
        .cnt-btn { background: #333; color: #fff; border: none; width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
        .promo-section { margin: 20px 15px; text-align: left; border: 1px solid #fff; border-radius: 12px; padding: 10px; }
        .promo-input { background: transparent; border: none; color: #fff; padding: 10px; flex-grow: 1; outline: none; }
        .address-form { padding: 15px; text-align: left; }
        .address-form input { width: 100%; padding: 14px; margin: 8px 0 18px; background: #111; border: 1px solid #333; border-radius: 12px; color: #fff; box-sizing: border-box; }
        .check-section { text-align: left; padding: 15px; background: #111; border: 1px solid #222; border-radius: 15px; margin: 10px 15px; }
        #info-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 85%; background: #111; border-radius: 20px 20px 0 0; transition: 0.3s; z-index: 1000; }
        #info-sheet.open { bottom: 0; }
        .blur { filter: blur(5px); }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="main-screen">
            <h2 style="margin-top:20px;">MorozovShop</h2>
            <div class="product-grid">
                <div class="product-item">
                    <img src="ruchka.webp" onclick="showInfo('Handle')">
                    <div class="product-name">Ручка Arm</div>
                    <div class="price">$35.00</div>
                    <div class="btn-group">
                        <button id="add-Handle" class="add-btn" onclick="firstAdd('Handle', 35)">ДОБАВИТЬ</button>
                        <div id="ctrl-Handle" class="count-ctrl">
                            <button class="cnt-btn" onclick="changeCount('Handle', 35, -1)">-</button>
                            <span id="count-Handle">1</span>
                            <button class="cnt-btn" onclick="changeCount('Handle', 35, 1)">+</button>
                        </div>
                        <button class="info-btn" onclick="showInfo('Handle')">ИНФО</button>
                    </div>
                </div>
                <div class="product-item">
                    <img src="expander.webp" onclick="showInfo('Expander')">
                    <div class="product-name">Эспандер</div>
                    <div class="price">$12.00</div>
                    <div class="btn-group">
                        <button id="add-Expander" class="add-btn" onclick="firstAdd('Expander', 12)">ДОБАВИТЬ</button>
                        <div id="ctrl-Expander" class="count-ctrl">
                            <button class="cnt-btn" onclick="changeCount('Expander', 12, -1)">-</button>
                            <span id="count-Expander">1</span>
                            <button class="cnt-btn" onclick="changeCount('Expander', 12, 1)">+</button>
                        </div>
                        <button class="info-btn" onclick="showInfo('Expander')">ИНФО</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="cart-screen" style="display:none;">
            <h3>Корзина</h3>
            <div id="cart-items-list"></div>
            <div class="promo-section">
                <div style="display:flex;">
                    <input type="text" id="promo-input" class="promo-input" placeholder="Промокод">
                    <button class="add-btn" style="padding:0 10px;" onclick="applyPromo()">OK</button>
                </div>
                <div id="promo-msg" style="font-size:10px; margin-top:5px;"></div>
            </div>
            <div id="cart-total-price" style="font-size:20px; font-weight:bold; padding:15px;">$0.00</div>
        </div>

        <div id="address-screen" style="display:none;">
            <div class="address-form">
                <label>ФИО</label><input type="text" id="fio" placeholder="Иванов Иван">
                <label>Телефон</label><input type="tel" id="phone" placeholder="+7...">
                <label>Страна</label><input type="text" id="country" placeholder="Россия">
                <label>Город</label><input type="text" id="city" placeholder="Москва">
                <label>СДЭК адрес</label><input type="text" id="cdek-addr" placeholder="Пункт выдачи">
                <label>Email</label><input type="email" id="email" placeholder="mail@example.com">
            </div>
        </div>

        <div id="checkout-screen" style="display:none;">
            <div class="check-section"><h4>Заказ</h4><div id="check-items"></div></div>
            <div class="check-section"><h4>Доставка</h4><div id="check-address"></div></div>
            <div id="check-total-price" style="font-size:20px; font-weight:bold; padding:15px;"></div>
        </div>
    </div>

    <div id="info-sheet">
        <div style="padding:20px;">
            <button onclick="closeInfo()" style="float:right; background:none; color:#fff; border:none; font-size:20px;">×</button>
            <h3 id="sheet-title"></h3>
            <img src="" id="sheet-img" style="width:100%; max-height:200px; object-fit:contain;">
            <p id="sheet-desc"></p>
            <p id="sheet-price" style="font-weight:bold;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
