    <div id="shop-screen" class="screen active">
        <h2 class="main-title">MITHRILARM</h2>
        <div class="container">

            <!-- Карточка 1 - Ручка Arm -->
            <div class="card" id="item1">
                <div class="product-image">
                    <img src="ruchka.webp" alt="Ручка Arm">
                    <div class="new-badge">NEW</div>
                </div>
                <h3>Ручка Arm</h3>
                <div class="price">$35.00</div>
                <p class="desc">Профессиональная ручка для тренировок</p>
                
                <button class="btn-black add-trigger" onclick="addToCart('item1')">ДОБАВИТЬ В КОРЗИНУ</button>
                
                <div class="counter">
                    <button onclick="changeQty('item1', -1)">−</button>
                    <span class="qty">1</span>
                    <button onclick="changeQty('item1', 1)">+</button>
                </div>

                <button class="btn-info" onclick="showInfo('item1')">Подробнее</button>
            </div>

            <!-- Карточка 2 - Эспандер -->
            <div class="card" id="item2">
                <div class="product-image">
                    <img src="expander.webp" alt="Эспандер">
                </div>
                <h3>Эспандер</h3>
                <div class="price">$12.00</div>
                <p class="desc">Кистевой эспандер для силы хвата</p>
                
                <button class="btn-black add-trigger" onclick="addToCart('item2')">ДОБАВИТЬ В КОРЗИНУ</button>
                
                <div class="counter">
                    <button onclick="changeQty('item2', -1)">−</button>
                    <span class="qty">1</span>
                    <button onclick="changeQty('item2', 1)">+</button>
                </div>

                <button class="btn-info" onclick="showInfo('item2')">Подробнее</button>
            </div>

        </div>
    </div>
