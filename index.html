<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MithrilARM Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="main-wrapper">
        <div id="screen-main" class="screen active">
            <h2 class="shop-title">MITHRILARM</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="ruchka.webp" alt="Ручка">
                    <div class="card-body">
                        <b>Ручка Arm</b>
                        <p>$35.00</p>
                        <button class="btn-add" onclick="addItem('Ручка Arm', 35)">ДОБАВИТЬ</button>
                        <button class="btn-info" onclick="openInfo('Ручка Arm', '$35', 'ruchka.webp')">ИНФО</button>
                    </div>
                </div>
                <div class="product-card">
                    <img src="expander.webp" alt="Эспандер">
                    <div class="card-body">
                        <b>Эспандер</b>
                        <p>$12.00</p>
                        <button class="btn-add" onclick="addItem('Эспандер', 12)">ДОБАВИТЬ</button>
                        <button class="btn-info" onclick="openInfo('Эспандер', '$12', 'expander.webp')">ИНФО</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-cart" class="screen">
            <h3>Ваша корзина</h3>
            <div id="cart-content"></div>
            <div class="promo-section">
                <input type="text" id="promo-field" placeholder="Промокод">
                <button onclick="applyPromo()">OK</button>
            </div>
            <div class="total-line">Итого: <span id="total-price">$0</span></div>
        </div>

        <div id="screen-delivery" class="screen">
            <h3>Адрес доставки</h3>
            <div class="input-group">
                <label>Фамилия Имя Отчество</label>
                <input type="text" id="user-fio">
                <label>Номер телефона</label>
                <input type="tel" id="user-phone">
                <label>Страна</label>
                <input type="text" id="user-country">
                <label>Город</label>
                <input type="text" id="user-city">
                <label>Улица, дом, квартира</label>
                <input type="text" id="user-address">
                <label>Электронная почта</label>
                <input type="email" id="user-email">
            </div>
        </div>
    </div>

    <div id="modal-info" class="modal">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <img id="modal-img" src="" alt="">
            <p>Профессиональное оборудование MithrilARM для армрестлинга.</p>
            <button class="btn-add" onclick="closeInfo()">ПОНЯТНО</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
